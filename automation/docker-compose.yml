# ============================================================
# automation/docker-compose.yml
# Node-RED SEO Automation — Réseau isolé, ressources limitées
# NE TOUCHE PAS à /root/app/docker-compose.prod.yml
# ============================================================

services:

  # ── Node-RED ────────────────────────────────────────────────
  nodered:
    image: nodered/node-red:3-18-alpine
    container_name: kpsy_nodered
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=Africa/Dakar
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:?Définir dans .env}
    volumes:
      # Persistance flows, credentials, settings
      - ./data:/data
      # Settings personnalisés (auth admin, sécurité)
      - ./settings.js:/data/settings.js:ro
    ports:
      # Exposé uniquement en loopback → accès via SSH tunnel ou Nginx reverse proxy
      # Pour accéder : ssh -L 1880:localhost:1880 root@TON_VPS_IP
      - "127.0.0.1:1880:1880"
    networks:
      - automation_net
    # ── Limites ressources (ne jamais prendre la priorité sur itam_backend) ──
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
        reservations:
          memory: 128M
    # Pour Docker Compose v2 (sans Swarm), utiliser :
    mem_limit: 768m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Lighthouse Runner (conteneur satellite ponctuel) ─────────
  # Lance un audit Lighthouse sur demande de Node-RED, puis s'arrête.
  # Il NE tourne PAS en continu — démarré/arrêté par le flow Node-RED.
  lighthouse:
    image: ghcr.io/puppeteer/puppeteer:22-alpine
    container_name: kpsy_lighthouse
    restart: "no"
    profiles:
      # Démarré uniquement quand Node-RED l'appelle (via exec ou API)
      - lighthouse
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data/audits:/reports
    networks:
      - automation_net
    mem_limit: 1g
    cpus: 0.80
    cap_add:
      - SYS_ADMIN  # Requis pour Chrome headless dans Docker

networks:
  # Réseau entièrement isolé — aucune connexion vers itam_postgres ou itam_backend
  automation_net:
    name: automation_net
    driver: bridge
    # IMPORTANT : pas de "external: true" sur itam_default
    # → isolation réseau garantie par conception

volumes: {}
# Pas de volumes nommés Docker — tout est en bind mount ./data/
# pour faciliter la sauvegarde et la lisibilité
