# ============================================================
# Inventaire Parc Informatique — Docker Compose
# Ports alloués : 3010-3015 (voir PORTS.md pour le détail)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: itam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-itam_db}
      POSTGRES_USER: ${DB_USER:-itam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itam_user} -d ${DB_NAME:-itam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: itam_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-itam_user}:${DB_PASSWORD:?DB_PASSWORD est obligatoire}@postgres:5432/${DB_NAME:-itam_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Multi-tenant : sous-domaine par défaut en dev (utiliser X-Tenant-ID header)
      DEFAULT_LEGACY_SUBDOMAIN: ${DEFAULT_LEGACY_SUBDOMAIN:-legacy}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    volumes:
      - itam_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Port 3010 → Backend NestJS API
      - "${BACKEND_PORT:-3010}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: itam_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_WHATSAPP_SUPPORT_NUMBER: ${VITE_WHATSAPP_SUPPORT_NUMBER}
    depends_on:
      - backend
    ports:
      # Port 3011 → Frontend Vite dev server
      - "${FRONTEND_PORT:-3011}:80"

  backup:
    image: postgres:16-alpine
    container_name: itam_backup
    restart: unless-stopped
    volumes:
      - postgres_backups:/backups
      - ./scripts:/scripts
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-itam_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      - DB_NAME=${DB_NAME:-itam_db}
    entrypoint: >
      sh -c "
      echo '0 2 * * * sh /scripts/backup-postgres.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root &&
      exec crond -f -l 8
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Services réservés (3013-3015) ----
  # worker:          # Port 3013 — Worker de facturation (futur)
  # notifications:   # Port 3014 — Service de notifications (futur)
  # adminer:         # Port 3015 — Interface admin DB (dev optionnel)
  #   image: adminer
  #   container_name: itam_adminer
  #   restart: unless-stopped
  #   ports:
  #     - "3015:8080"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
  postgres_backups:
  itam_uploads:
