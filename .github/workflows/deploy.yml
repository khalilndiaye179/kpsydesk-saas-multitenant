# ============================================================
# KPSyDesk ITAM — Pipeline CI/CD
# Déclencheur : push sur master → déploiement VPS Hostinger
# ============================================================

name: 🚀 Deploy to Hostinger VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:        # Permet aussi le déclenchement manuel

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (pour vérifier la syntaxe du workflow) ──
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      # ── 2. Connexion SSH et déploiement sur le VPS ──
      - name: 🔐 SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Déploiement KPSyDesk ITAM — $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /root/app

            echo "📥 [1/4] Git pull..."
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git pull https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git master

            echo "🔨 [2/4] Rebuild des containers Docker..."
            docker compose up -d --build --remove-orphans

            echo "🗄️  [3/4] Migrations Prisma..."
            docker compose exec -T backend npx prisma migrate deploy || echo "⚠️  Pas de migration à appliquer"

            echo "🩺 [4/4] Vérification des services..."
            docker compose ps

            echo ""
            echo "✅ Déploiement terminé avec succès !"
            echo "🌐 https://app.kpsyinformatique.com"
